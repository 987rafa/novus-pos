services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novus
      POSTGRES_PASSWORD: novus
      POSTGRES_DB: novus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novus -d novus"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://novus:novus@db:5432/novus
      SECRET_KEY: change-me-in-production
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
